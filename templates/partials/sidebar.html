<!-- ═══════════════════════════════════════════════════════
     FARMER SIDEBAR — desktop fixed | mobile slide-in drawer
     ═══════════════════════════════════════════════════════ -->

<div id="farmerSidebar" class="fmd-sidebar text-white"
     style="background:linear-gradient(180deg,#15803D 0%,#166534 50%,#14532D 100%);">

  <!-- Close button — mobile only -->
  <button class="sidebar-close-btn d-md-none" onclick="closeFarmerSidebar()" aria-label="Close menu">
    <i class="fas fa-times"></i>
  </button>

  <!-- Profile image section -->
  <div class="px-4 py-4 border-bottom" style="border-color:rgba(255,255,255,0.15)!important;">
    <div class="d-flex align-items-center">

      {% if request.user.profile.profile_image %}
        <img src="{{ request.user.profile.profile_image.url }}"
             alt="Profile Image"
             style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #FB923C;">
      {% else %}
        <img src="/media/profile_images/default.png"
             alt="Default Image"
             style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #FB923C;">
      {% endif %}

      <div class="ms-2">
        <div style="color:white;font-size:12px;font-weight:700;">
          {{ request.user.get_full_name|default:request.user.email }}
        </div>
        <div style="color:white;font-size:10px;">
          Farmer
        </div>
      </div>

    </div>
  </div>

  <!-- Navigation -->
  <nav class="mt-2 px-2 pb-3" style="overflow-y:auto;flex:1;">

    <p class="nav-section-label">Menu</p>

    <a href="{% url 'dashboard' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-th-large me-2"></i>Dashboard
    </a>

    <a href="{% url 'upload_image' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'upload_image' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-cloud-upload-alt me-2"></i>Upload Image
    </a>

    <a href="{% url 'history' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-history me-2"></i>History
    </a>

    <a href="{% url 'reports' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-file-alt me-2"></i>Reports
    </a>

    <a href="{% url 'profile' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-user-circle me-2"></i>My Profile
    </a>

    <a href="{% url 'help' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'help' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-question-circle me-2"></i>Help
    </a>

    <p class="nav-section-label" style="padding-top:16px;">Communication</p>

    <a href="{% url 'farmer_inbox' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'farmer_inbox' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-comments me-2"></i>Messages
    </a>

    <a href="{% url 'farmer_appointments' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'farmer_appointments' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-calendar-check me-2"></i>Appointments
    </a>

    <a href="{% url 'vaccination_list' %}"
       class="farmer-nav-link {% if request.resolver_match.url_name == 'vaccination_list' %}active{% endif %}"
       onclick="closeFarmerSidebar()">
      <i class="fas fa-syringe me-2"></i>Vaccination
    </a>

  </nav>

  <!-- Logout -->
  <div class="p-3 border-top" style="border-color:rgba(255,255,255,0.15)!important;">
    <a href="{% url 'logout' %}"
       class="btn w-100 fw-semibold"
       style="background:rgba(255,255,255,0.12);color:white;border:1px solid rgba(255,255,255,0.2);border-radius:10px;">
      <i class="fas fa-sign-out-alt me-2"></i>Logout
    </a>
  </div>

</div>

<style>
.fmd-sidebar {
  width: 250px;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 1050;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.farmer-nav-link {
  display: flex;
  align-items: center;
  color: white;
  text-decoration: none;
  padding: 11px 14px;
  margin-bottom: 6px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.farmer-nav-link:hover {
  background: rgba(255,255,255,0.12);
  color: white;
}

.farmer-nav-link.active {
  background: white !important;
  color: #15803D !important;
}

.nav-section-label {
  color: rgba(255,255,255,0.65);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 8px 12px 4px;
  margin-bottom: 4px;
}

.sidebar-close-btn {
  position: absolute;
  right: 12px;
  top: 12px;
  background: rgba(255,255,255,0.15);
  color: white;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
}

@media (max-width: 767px) {
  .fmd-sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }

  .fmd-sidebar.open {
    transform: translateX(0);
  }
}
</style>
