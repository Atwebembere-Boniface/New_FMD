<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{% block title %}{{ title }}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* =====================================================
           GLOBAL GREEN THEME OVERRIDES
        ===================================================== */
        body { color: #15803D !important; }

        .sidebar { background: linear-gradient(180deg,#15803D 0%,#166534 100%) !important; }
        .bg-primary   { background-color: #15803D !important; }
        .text-primary { color: #15803D !important; }
        .border-primary { border-color: #15803D !important; }

        .btn-primary {
            background: linear-gradient(90deg,#15803D 0%,#FB923C 100%) !important;
            border-color: #15803D !important;
            color: #fff !important;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(90deg,#166534 0%,#ea7c1e 100%) !important;
            box-shadow: 0 6px 15px rgba(21,128,61,.4) !important;
        }
        .btn-outline-primary { color:#15803D !important; border-color:#15803D !important; }
        .btn-outline-primary:hover { background-color:#15803D !important; color:#fff !important; }

        .form-control:focus, .form-select:focus {
            border-color: #15803D !important;
            box-shadow: 0 0 0 .25rem rgba(21,128,61,.25) !important;
        }
        .form-control, .form-select { border-color: #15803D !important; }

        .badge.bg-primary, .badge.text-bg-primary { background-color:#15803D !important; color:#fff !important; }
        .progress-bar { background-color:#15803D !important; }
        .table thead th { border-bottom-color:#15803D !important; background-color:rgba(21,128,61,.05) !important; }
        .page-item.active .page-link { background-color:#15803D !important; border-color:#15803D !important; }
        .page-link { color:#15803D !important; }
        .nav-pills .nav-link.active, .nav-tabs .nav-link.active {
            background-color:#15803D !important; border-color:#15803D !important; color:#fff !important;
        }
        .alert-primary { background-color:rgba(21,128,61,.1) !important; border-color:#15803D !important; }
        .farmer-nav-link.active { background-color:#fff !important; color:#15803D !important; }
        .sidebar-overlay.active { background:rgba(21,128,61,.5) !important; }
        .mobile-menu-toggle { background:linear-gradient(135deg,#15803D,#FB923C) !important; }
        ::-webkit-scrollbar-thumb { background:#15803D !important; }
        ::-webkit-scrollbar-thumb:hover { background:#FB923C !important; }
        .auth-wrapper {
            background: linear-gradient(135deg,rgba(21,128,61,.9) 0%,rgba(22,101,52,.85) 100%),
                        url('https://images.unsplash.com/photo-1560493676-04071c5f467b?w=1600') center/cover !important;
        }

        /* =====================================================
           MOBILE LAYOUT — main content pushes down on mobile
           so the fixed top bar doesn't overlap content
        ===================================================== */

        /* Desktop: content offset by sidebar width */
        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }

        /* Mobile: no left margin, add top padding for topbar */
        @media (max-width: 767px) {
            .main-content {
                margin-left: 0 !important;
                width: 100% !important;
                padding-top: 56px !important; /* height of mobile topbar */
            }

            /* Make tables horizontally scrollable */
            .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }

            /* Ensure images fit screen */
            img { max-width: 100% !important; height: auto !important; }

            /* Stack flex rows on mobile */
            .stats-grid { flex-direction: column !important; }

            /* Full-width cards on mobile */
            .card { margin-bottom: 16px; }

            /* Readable font sizes on mobile */
            body { font-size: 15px; }
            h4 { font-size: 18px !important; }
            h5 { font-size: 16px !important; }
            h6 { font-size: 14px !important; }

            /* Buttons full width on small screens */
            .btn-mobile-full { width: 100% !important; }

            /* Detection result image — force visible */
            .detection-image-box {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            .detection-image-box img {
                width: 100% !important;
                height: auto !important;
                display: block !important;
                border-radius: 12px;
            }

            /* Container padding */
            .container-fluid { padding-left: 12px !important; padding-right: 12px !important; }
            .p-4 { padding: 16px !important; }
            .p-5 { padding: 20px !important; }
        }

        @media (max-width: 480px) {
            .main-content { padding-top: 56px !important; }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% if messages %}
        <div class="position-fixed top-0 end-0 p-3" style="z-index:11000;margin-top:56px;">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
<df-messenger
  intent="WELCOME"
  chat-title="fmd"
  agent-id="975a5d26-32a5-4c14-8286-1483d83a728d"
  language-code="en"
></df-messenger>

</body>
</html>
